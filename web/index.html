<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OnDeck</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./app.ts"></script>
  </head>
  <body>
    <main id="app" v-cloak>
      <div class="app-shell" :class="{ 'signed-in': user }">
      <p v-if="!authReady" role="status">Loading…</p>
      <p v-if="authError" role="alert" class="error">{{ authError }}</p>
      <section v-if="authReady && !authError && !user" class="sign-in">
        <h1>OnDeck</h1>
        <p>{{ joinToken ? 'Sign in to join your group.' : 'A place for your next idea.' }}</p>
        <button class="primary" @click="signIn">Sign in</button>
        <button @click="signUp">Create account</button>
      </section>
      <template v-if="user">
        <aside class="sidebar">
          <div class="sidebar-top"><a class="wordmark" href="#" @click.prevent="!busy && navigate('groups')">OnDeck</a><button class="menu-toggle" @click="menuOpen=!menuOpen" :aria-expanded="menuOpen" aria-controls="main-navigation">Menu</button></div>
          <nav id="main-navigation" :class="{ expanded: menuOpen }" aria-label="Main navigation">
            <button :disabled="busy" @click="navigate('groups')" :aria-current="tab==='groups' ? 'page' : undefined"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg> Groups <span v-if="invitations.length" class="badge">{{ invitations.length }}</span></button>
            <button :disabled="busy" @click="navigate('deck')" :aria-current="tab==='deck' ? 'page' : undefined"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="7" width="16" height="14" rx="2"/><path d="M7 3h10M7 12h10M7 16h6"/></svg> On Deck</button>
            <button :disabled="busy" @click="navigate('add')" :aria-current="tab==='add' ? 'page' : undefined"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg> Add activity</button>
            <button :disabled="busy" @click="navigate('pick')" :aria-current="tab==='pick' ? 'page' : undefined"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5L12 3Z"/></svg> Pick for Now</button>
          </nav>
          <div class="account"><button class="text-button account-name" @click="editProfile">{{ accountName }}</button><button class="text-button" @click="signOut" :disabled="busy">Sign out</button></div>
        </aside>
        <div class="workspace">
          <div class="notices" aria-live="polite">
            <p v-if="busy || message" role="status">{{ busy ? 'Working…' : message }}</p>
            <p v-if="syncWarning" class="hint" role="status">{{ syncWarning }}</p>
            <p v-if="namesWarning" class="hint">{{ namesWarning }}</p>
            <p v-if="error" role="alert" class="error">{{ error }}</p>
          </div>
          <fieldset :disabled="busy">
            <template v-if="!detail">
            <div v-if="tab==='deck' || tab==='pick'" class="group-toolbar">
              <group-picker :groups="groups" :value="group" :disabled="busy" @change="switchGroup"></group-picker>
              <button v-if="group" class="text-button" @click="openMembers(group)">Members</button>
            </div>
            <section v-if="tab==='groups' && !manageGroup">
              <div class="page-heading"><h1>{{ newGroupOpen ? (editingGroup ? 'Edit group' : 'New group') : 'Groups' }}</h1><button v-if="!newGroupOpen" class="primary" @click="beginNewGroup">＋ New group</button></div>
              <form-surface v-if="newGroupOpen" @submit.prevent="createGroup" class="group-form">
                <section class="form-section"><h2>Group details</h2><label for="group-name">Name</label><input id="group-name" v-model="groupName" required maxlength="120" placeholder="Roommates" /></section>
                <section class="form-section"><h2>Group picture</h2><div class="group-picture-preview" :class="{ 'has-picture': groupPicture }"><img v-if="groupPicture" :src="groupPicture" alt="Group picture preview" /><span v-else>No picture selected</span></div>
                  <div class="picture-actions"><label class="upload-button" for="group-picture">{{ pictureBusy ? 'Preparing picture…' : groupPicture ? 'Change picture' : 'Choose picture' }}</label><input id="group-picture" class="sr-only group-picture-input" type="file" accept="image/jpeg,image/png,image/webp" @change="chooseGroupPicture" :disabled="pictureBusy" /><button v-if="groupPicture" type="button" @click="editGroupPicture">Edit picture</button><button v-if="groupPicture" type="button" class="text-button danger-text" @click="removeGroupPicture">Delete picture</button></div><p v-if="pictureError" class="error field-error" role="alert">{{ pictureError }}</p>
                </section>
                <template #actions><button type="button" @click="cancelGroupForm">Cancel</button><button class="primary" :disabled="pictureBusy">{{ editingGroup ? 'Save changes' : 'Create' }}</button></template>
              </form-surface>
              <template v-else>
          <section v-if="joinToken" class="invite-preview">
            <h2>{{ joinPreview?.name || 'Group invitation' }}</h2>
            <button class="primary" @click="joinGroup" :disabled="busy || !joinPreview">Accept</button>
            <button @click="dismissInvite">Decline</button>
          </section>
              <div v-if="invitations.length" class="invitations">
                <h2>Invitations</h2><article v-for="i in invitations" :key="i.invitation"><div><strong>{{ i.name }}</strong><p class="hint">Invited by {{ person(i.inviter) }}</p></div><button class="primary" @click="invitationAction(i.invitation,true)">Accept</button><button class="text-button" @click="invitationAction(i.invitation,false)">Decline</button></article>
              </div>
              <p v-if="!groups.length && !busy" class="empty-state">No groups yet. Create one or open an invite link.</p>
              <p id="group-reorder-help" class="sr-only">Drag the handle to reorder. When focused, use arrow keys to move a group.</p>
              <p class="sr-only group-order-status" role="status" aria-live="polite">{{ orderStatus }}</p>
              <div class="group-grid" v-sortable-groups="{ disabled: busy || savingGroupOrder, start: startGroupDrag, finish: finishGroupDrag }">
                <group-card v-for="g in groups" :key="g.group" :group="g" :person="person" @open="openGroup(g.group)" @members="openMembers(g.group)" @delete="deleteGroup(g.group)" @edit="openEditGroup(g.group)" @move="moveGroup(g.group,$event)"></group-card>
              </div>
              </template>
            </section>
            <section v-if="tab==='groups' && manageGroup && group" class="group-management">
              <button class="text-button back-button" @click="navigate('groups')">← All groups</button>
              <div class="page-heading"><h1 tabindex="-1">{{ currentGroup?.name }}</h1><div class="heading-actions"><button @click="openEditGroup(group)">Edit group</button><button @click="openGroup(group)">Open On Deck</button></div></div>
              <div class="management-layout">
                <section class="members-panel" aria-labelledby="members-heading">
                  <h2 id="members-heading">Members <span class="count">{{ members.length }}</span></h2>
                  <ul class="member-list"><li v-for="member in members" :key="member"><span class="avatar">{{ person(member).slice(0,1).toUpperCase() }}</span><span class="member-name">{{ person(member) }}</span><span v-if="member===user" class="you-badge">You</span></li></ul>
                </section>
                <section class="invite-panel" aria-labelledby="invite-heading">
                  <h2 id="invite-heading">Invite people</h2>
                  <button class="primary" @click="copyInvite">Copy invite link</button>
                  <ul v-if="inviteLinks.length" class="invite-list" aria-label="Active invitations"><li v-for="link in inviteLinks" :key="link.link"><span>Invite link</span><button class="text-button danger-text" @click="revokeInvite(link.link)" aria-label="Revoke invite link">Revoke</button></li></ul>
                </section>
              </div>
              <div class="group-management-actions"><button class="danger-outline" @click="leave">Leave group</button><button class="text-button danger-text" @click="deleteGroup(group)">Delete group</button></div>
            </section>
            <section v-if="tab==='deck'" class="deck">
              <div class="page-heading"><h1>On Deck</h1><button v-if="group" class="primary" @click="navigate('add')">＋ Add activity</button></div>
              <div v-if="!group" class="empty-state"><p>Choose a group to start.</p><button :disabled="busy" @click="navigate('groups')">Groups</button></div>
              <div v-else-if="!activities.length" class="empty-state"><p>No ideas yet.</p><button class="primary" @click="navigate('add')">Add an activity</button></div>
              <div class="activity-grid"><activity-card v-for="a in activities" :key="a.suggestion" :activity="a" :user="user" :person="person" @open="open" @heart="toggleHeart" @delete="deleteActivity"></activity-card></div>
            </section>
            <section v-if="tab==='add'" class="add-page">
              <h1>Add activity</h1>
              <form-surface @submit.prevent="save" class="activity-form">
                <p v-if="savedActivity" class="hint">Saved. Retry sharing below.</p>
                <fieldset :disabled="!!savedActivity" class="form-section"><h2>Activity details</h2>
                  <label>What's the idea?<input v-model="fields.name" required placeholder="Coffee" maxlength="500" /></label>
                  <label>Link <span class="optional">optional</span><input v-model="fields.source" placeholder="https://…" /></label>
                    <label>Description<textarea v-model="fields.description"></textarea></label>
                    <div class="row"><label>Category<input v-model="fields.category" /></label><label>Location<input v-model="fields.location" /></label></div>
                    <div class="row"><label>Cost per person<input v-model="fields.cost" type="number" min="0" step="any" placeholder="Unknown" /></label><label>Currency<input v-model="fields.currency" maxlength="3" :required="fields.cost!==''" /></label></div>
                    <label>Date and time<input v-model="fields.dateTime" type="datetime-local" /></label>
                </fieldset>
                <fieldset class="share-picker form-section"><legend class="share-heading"><span>Share with</span><span v-if="groups.length" class="share-selection-actions"><button type="button" class="text-button" @click="toggleAllShareGroups" :disabled="groups.every(g => sharedGroups.includes(g.group))">{{ allShareGroupsSelected ? 'Clear selection' : 'Select all' }}</button></span></legend><label v-for="g in groups" :key="g.group" class="choice"><input type="checkbox" v-model="shareGroups" :value="g.group" :disabled="sharedGroups.includes(g.group)" />{{ g.name }}{{ sharedGroups.includes(g.group) ? ' ✓' : '' }}</label></fieldset>
                <p v-if="!groups.length"><button type="button" @click="navigate('groups')">Create a group</button></p>
                <template #actions><button type="button" @click="navigate('deck')">Cancel</button><div class="heading-actions"><button v-if="fields.name || capture" class="text-button" type="button" @click="discard" :disabled="!!savedActivity">Discard</button><button class="primary" :disabled="!shareGroups.length">{{ savedActivity ? 'Retry sharing' : 'Save and share' }}</button></div></template>
              </form-surface>
            </section>
          <section v-if="tab==='pick'">
            <h1>Pick for Now</h1>
            <p v-if="!group">Choose a group first.</p>
            <form-surface v-else @submit.prevent="pick" class="pick-form">
              <section class="form-section people-section" aria-labelledby="pick-people-heading">
                <div class="pick-section-heading"><h2 id="pick-people-heading">People</h2><span class="selection-count" role="status">{{ participants.length }} selected</span></div>
                <div class="people-choices"><label v-for="member in members" :key="member" class="choice person-choice"><input type="checkbox" v-model="participants" :value="member" /><span class="avatar" aria-hidden="true">{{ person(member).slice(0,1).toUpperCase() }}</span><span>{{ person(member) }}</span><span v-if="member===user" class="you-badge">You</span></label></div>
              </section>
              <details class="form-section pick-filters">
                <summary aria-label="Filters"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h18l-7 8v7l-4 2v-9L3 4Z"/></svg><span>Filters</span><span class="optional">Optional</span><span class="filter-disclosure-label" aria-hidden="true">Adjust</span></summary>
                <div class="row">
                  <label>Category <input v-model="filters.category" /></label
                  ><label>Location <input v-model="filters.location" /></label>
                </div>
                <div class="row">
                  <label
                    >Maximum cost
                    <input
                      v-model="filters.maxCost"
                      type="number"
                      min="0"
                      step="any" /></label
                  ><label
                    >Currency code
                    <input
                      v-model="filters.currency"
                      maxlength="3"
                      :required="filters.maxCost!==''"
                  /></label>
                </div>
                <div class="row">
                  <label
                    >From
                    <input
                      v-model="filters.from"
                      type="datetime-local" /></label
                  ><label
                    >Until <input v-model="filters.until" type="datetime-local"
                  /></label>
                </div>
                <p class="hint">
                  Budget filters exclude unknown costs; date filters exclude
                  activities without dates.
                </p>
              </details>
              <template #actions><button type="button" @click="navigate('deck')">Cancel</button><button class="primary" :disabled="!participants.length">Find options →</button></template>
            </form-surface>
            <p v-if="picked && !options.length">
              No activities match. Try fewer filters or add an idea.
            </p>
            <ol>
              <li v-for="a in options" :key="a.activity">
                <button class="link" @click="open(a)">{{ a.name }}</button>
                <p>
                  {{ a.wantedCount }} interested · {{ a.completedCount }} have
                  been · {{ cost(a) }}
                </p>
              </li>
            </ol>
          </section>
            </template>
            <activity-details v-if="detail" :activity="detail" :user="user" :person="person" :group-name="currentGroup?.name || 'On Deck'" :source-url="safeLink(detail.source)" :cost-label="cost(detail)" @back="closeDetails" @action="update" @repeat="update('repeat',$event)" @delete="deleteActivity(detail)"></activity-details>
          </fieldset>
        </div>
      </template>
      <picture-editor :source="pictureSource" @apply="applyGroupPicture" @cancel="cancelPictureEditor"></picture-editor>
      <confirm-dialog :prompt="confirmation" @answer="answerConfirmation"></confirm-dialog>
      </div>
    </main>
    <noscript>Enable JavaScript to use OnDeck.</noscript>
  </body>
</html>
